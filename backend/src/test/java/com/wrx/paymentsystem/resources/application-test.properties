# TEST CONFIG
spring.datasource.url=jdbc:h2:mem:payment_system_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT
jwt.secret=test-secret-key-12345678901234567890123456789012
jwt.expiration=60000 # 1 minute for tests

# Security (simplified for testing)
spring.security.user.name=test
spring.security.user.password=test
spring.security.user.roles=USER

# Disable CSRF for testing
spring.security.csrf.enabled=false