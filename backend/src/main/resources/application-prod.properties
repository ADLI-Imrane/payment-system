# SERVER
server.port=8080
server.compression.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

# DATABASE
spring.datasource.url=jdbc:mysql://${DB_HOST:prod-db-server}:3306/payment_system_prod?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:prod_user}
spring.datasource.password=${DB_PASSWORD:prod_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT
jwt.secret=${JWT_SECRET:prod-secret-key-67890}
jwt.expiration=3600000 # 1 hour

# SECURITY
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# LOGGING
logging.file.name=/var/log/payment-system/payment-system.log
logging.file.max-size=50MB
logging.file.max-history=30
logging.level.com.wrx.paymentsystem=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# SWAGGER
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# AUDITING
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true